  body {

    padding: 12px;
    margin: 0;
    background-color: #f5f5f5;
    color: #222;
    font-size: 18px;
    line-height: 1.4;
  }

  .section {
    background-color: #fff;
    border: 2px solid #cfcfcf;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    margin-bottom: 16px;
  }

  h2 {
    text-align: center;
    margin: 0 0 12px 0;
    color: #111;
    font-size: 1.4em;
    font-weight: 400;
    border-bottom: 2px solid #e5e5e5;
    padding-bottom: 8px;
  }

  .inspection-group + .inspection-group {
    margin-top: 14px;
  }

  .inspection-group h3 {
    margin: 0 0 8px;
    padding: 6px 10px;

    background: #eef6ff;
    color: #0056b3;

    margin-bottom: 8px;
  }

  #form-inspection .label-row {
    margin-bottom: 3px;
  }

  #form-inspection .label-row label {
    margin-bottom: 0;
  }

  #form-inspection textarea.autosize {
    display: block;
    min-height: 44px;
    padding: 7px 10px;
  }

  .inspection-entry {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .inspection-entry textarea { flex: 1; min-width: 0; }

  button.inspection-toggle {
    flex: 0 0 auto;
    width: auto;
    min-height: 44px;
    margin: 0;
    padding: 8px 12px;
    border: 1px solid #b9cbdc;
    background: #f0f4f8;
    color: #526579;
    font-size: 16px;
    white-space: nowrap;
    transition: background-color 180ms ease, color 180ms ease, box-shadow 180ms ease, transform 120ms ease;
  }

  button.inspection-toggle[aria-pressed="true"] {
    background: #007bff;
    border-color: #007bff;
    color: white;
    box-shadow: 0 2px 8px #007bff33;
  }

  button.inspection-toggle:active { transform: scale(.94); }
  button.inspection-toggle:focus-visible { outline: 3px solid #174875; outline-offset: 3px; }
  button.inspection-toggle.is-animating { animation: inspection-pop 240ms ease-out; }

    0% { transform: scale(.94); }
    65% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

    button.inspection-toggle { transition: none; }
    button.inspection-toggle.is-animating { animation: none; }
    button.inspection-toggle:active { transform: none; }
  }

  .form-row {
    margin-bottom: 12px;
  }

  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .label-row label,
  .form-row > label {
    font-weight: 400;
    font-size: 1.05em;
    display: block;
    margin-bottom: 4px;
  }

  .time-label {
    font-weight: 400;
    font-size: 0.95em;
    color: #444;
  }

  .time-display {
    margin-left: 4px;
    color: #c62828;
    font-weight: 400;
  }

  textarea.autosize,
  input[type="text"],
  input[type="number"],
  input[type="date"],
  input[type="datetime-local"],
  select {

    font-size: 1.08em;
    padding: 10px 12px;

    border: 2px solid #bdbdbd;
    border-radius: 8px;
    background: #fff;
    color: #222;

  textarea.autosize {
    line-height: 1.35;
  }

  .field-hint {
    margin: 5px 0 0;
    color: #666;
    font-size: 0.88em;
  }

    gap: 10px;
    margin-top: 6px;

    border: 2px solid #dbe5ef;
    background: #f8fbfe;
    color: #5b6b7c;
  }

    border-color: #007BFF;
    background: #007BFF;
    color: #fff;
    box-shadow: 0 0 6px rgba(0, 123, 255, 0.25);
  }

  .zone-record-card {

    padding: 14px;

    border-radius: 10px;

    display: none;

    color: #0056b3;
    font-size: 1.35em;
    font-weight: 600;
    text-align: center;

    margin-bottom: 0;
  }

  input[type="checkbox"] {

    vertical-align: middle;
  }

  button {
    margin-top: 4px;
    width: 100%;

    font-weight: 400;
    background-color: #007BFF;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  button:active {
    transform: scale(0.99);
  }

  .copy-action {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 54px;
    box-sizing: border-box;
    overflow: hidden;
    transition: height 500ms ease, transform 120ms ease;
  }

  .copy-action span {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    color: inherit;
    line-height: 1.2;
    pointer-events: none;
    transition: transform 500ms ease, opacity 500ms ease;
  }

  .copy-action .copy-label {
    transform: translate(-50%, -50%);
  }

  .copy-action .copy-success {
    opacity: 0;
    transform: translate(-50%, 100%);
  }

  .copy-action.is-copied {
    height: 62px;
  }

  .copy-action.is-copied .copy-label {
    opacity: 0;
    transform: translate(-50%, -150%);
  }

  .copy-action.is-copied .copy-success {
    opacity: 1;
    transform: translate(-50%, -50%);
    transition-delay: 200ms;
  }

  @media (prefers-reduced-motion: reduce) {
    .copy-action,
    .copy-action span {
      transition-duration: 1ms;
      transition-delay: 0ms;
    }
  }

  textarea.result {
    height: 180px;
    margin-top: 12px;
    width: 100%;
    box-sizing: border-box;
    font-size: 1.02em;
    line-height: 1.4;
    border: 2px solid #bdbdbd;
    border-radius: 8px;
    padding: 10px 12px;
    background: #fafafa;
    resize: none;
    overflow: auto;
  }

  #resultWater {
    height: 420px;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }

  .btn-group .btn {
  flex: 1;
  padding: 12px 8px;
  border-radius: 8px;
  border: 2px solid #dbe5ef;
  background: #f8fbfe;
  color: #5b6b7c;
  cursor: pointer;
  transition: 0.2s;
  font-size: 1.05em;
  font-weight: 400;
}

  .btn-group .btn.active {
    background: #007BFF;
    color: #fff;
    border-color: #007BFF;
    box-shadow: 0 0 6px rgba(0, 123, 255, 0.25);
  }

  .btn-group .btn:hover {
    background: #ececec;
  }

  .btn-group .btn.active:hover {
    background: #007BFF;
    color: #fff;
    border-color: #007BFF;
  }

  .person-selection-row {
    display: flex;
    gap: 10px;
    margin-top: 40px;
  }

  .person-selection-field {
    flex: 1 1 50%;
    min-width: 0;
  }

  .selection-display {
    min-height: 44px;
    box-sizing: border-box;
    border: none;
    background: transparent;
    color: #555;
    padding: 10px 12px;
    font-size: 1.08em;
    line-height: 1.35;
    text-align: center;
  }

  .selection-display.has-selection {
    background: transparent;
    color: #0056b3;
  }

  #date {
    text-align: center;
    font-size: 1.05em;
    font-weight: 400;
    margin: 0 0 12px 0;
    color: #444;
  }

  @media (max-width: 480px) {
    body {
      font-size: 19px;
      padding: 10px;
    }

    .section {
      padding: 12px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 1.3em;
    }

    textarea.autosize,
    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="datetime-local"],
    select {
      font-size: 1.1em;
      min-height: 46px;
    }

    button,
    .btn-group .btn {
      font-size: 1.08em;
      padding: 14px 10px;
    }

    #resultWater {
      height: 380px;
    }
  }
</style>

<body>

<!-- 上下班交接 -->
<div class="section">
  <h2>上下班交接</h2>

  <div class="form-row">
    <label>班別</label>
    <div class="btn-group" id="shiftName">
      <button type="button" data-value="A班" class="btn active">A班</button>
      <button type="button" data-value="B班" class="btn">B班</button>
    </div>
  </div>

  <div class="form-row">
    <label>類型</label>
    <div class="btn-group" id="shiftType">
      <button type="button" data-value="上班" class="btn active">上班</button>
      <button type="button" data-value="下班" class="btn">下班</button>
    </div>
  </div>

  <div class="form-row person-selection-row">
    <div class="person-selection-field">
      <label for="handoverPerson">人員</label>
      <input type="text" id="handoverPerson" placeholder="請輸入姓名">
    </div>
    <div class="person-selection-field">
      <label>目前選擇</label>
      <div id="currentShiftSelection" class="selection-display" aria-live="polite">未選擇</div>
    </div>
  </div>

  <div class="form-row">
    <label>交接物品</label>
    <input type="text" id="handoverItem" value="正常">
  </div>

  <div class="form-row">
    <label>交接事項</label>
    <textarea class="autosize" id="handoverNote">正常</textarea>
  </div>

  <div class="form-row">
    <label>補充說明</label>
    <textarea class="autosize" id="handoverExtra"></textarea>
  </div>

  <button type="button" class="copy-action" onclick="copyShift(this)" aria-label="複製交接內容">
    <span class="copy-label" aria-hidden="true">複製交接內容</span>
    <span class="copy-success" aria-hidden="true">已複製</span>
  </button>
  <textarea id="resultShift" class="result" readonly></textarea>
</div>

<!-- LINE 水電紀錄 -->
<div class="section">
  <h2>汙水用電紀錄</h2>
  <div class="form-row">
    <label>記錄區域</label>
    <div class="zone-toggle-group" id="recordZones" aria-label="選擇記錄區域">
      <button type="button" class="zone-toggle active" data-zone="A" aria-pressed="true" onclick="toggleRecordZone(this)">A區</button>
      <button type="button" class="zone-toggle" data-zone="C" aria-pressed="false" onclick="toggleRecordZone(this)">C區</button>
    </div>
  </div>

  <div class="zone-record-card" data-zone-card="A">
    <h3>A區</h3>
    <div class="form-row">
      <label for="waterStatusA">A區水表</label>
      <input type="number" inputmode="numeric" min="0" max="999999" step="1" id="waterStatusA" placeholder="請輸入水表讀數">
    </div>
    <div class="form-row">
      <label for="powerStatusA">A區電表</label>
      <input type="number" inputmode="numeric" min="0" max="99999" step="1" id="powerStatusA" placeholder="請輸入電表讀數">
    </div>
    <div class="form-row">
      <label for="chlorineDoseA">A區氯錠投藥量</label>
      <input type="number" inputmode="decimal" min="0" step="any" id="chlorineDoseA" placeholder="輸入投藥量">
    </div>
    <div class="form-row">
      <label for="recordNoteA">A區備註</label>
      <input type="text" id="recordNoteA" value="正常" placeholder="例如：正常">
    </div>
  </div>

  <div class="zone-record-card" data-zone-card="C" hidden>
    <h3>C區</h3>
    <div class="form-row">
      <label for="waterStatusC">C區水表</label>
      <input type="number" inputmode="numeric" min="0" max="999999" step="1" id="waterStatusC" placeholder="請輸入水表讀數">
    </div>
    <div class="form-row">
      <label for="powerStatusC">C區電表</label>
      <input type="number" inputmode="numeric" min="0" max="99999" step="1" id="powerStatusC" placeholder="請輸入電表讀數">
    </div>
    <div class="form-row">
      <label for="chlorineDoseC">C區氯錠投藥量</label>
      <input type="number" inputmode="decimal" min="0" step="any" id="chlorineDoseC" placeholder="輸入投藥量">
    </div>
    <div class="form-row">
      <label for="recordNoteC">C區備註</label>
      <input type="text" id="recordNoteC" value="正常" placeholder="例如：正常">
    </div>
  </div>

  <button type="button" class="copy-action" onclick="copyBrief(this)" aria-label="複製水電紀錄">
    <span class="copy-label" aria-hidden="true">複製水電紀錄</span>
    <span class="copy-success" aria-hidden="true">已複製</span>
  </button>
  <textarea id="resultBrief" class="result" readonly></textarea>
</div>

dden="true">✓</span></button></div><div class="tools"><label><input type="checkbox">記錄時間</label><span class="time"></span></div><details><summary>填寫／修改內容</summary><label for="inspect-note-17" hidden>2F會議室巡檢內容</label><textarea id="inspect-note-17" rows="1" placeholder="可填寫異常狀況"></textarea></details></article><article class="item" data-name="多功能交誼廳" data-done="false"><div class="head"><button class="toggle" type="button" aria-pressed="false"><span class="name">多功能交誼廳</span><span class="value">未巡檢</span><span class="mark" aria-hidden="true">✓</span></button></div><div class="tools"><label><input type="checkbox">記錄時間</label><span class="time"></span></div><details><summary>填寫／修改內容</summary><label for="inspect-note-18" hidden>多功能交誼廳巡檢內容</label><textarea id="inspect-note-18" rows="1" placeholder="可填寫異常狀況"></textarea></details></article></div></section><section class="estate" aria-label="朝陽官邸"><h2>朝陽官邸</h2><div class="group" data-group="朝陽官邸"><article class="item" data-name="粥品餐廳" data-done="false"><div class="head"><button class="toggle" type="button" aria-pressed="false"><span class="name">粥品餐廳</span><span class="value">未巡檢</span><span class="mark" aria-hidden="true">✓</span></button></div><div class="tools"><label><input type="checkbox">記錄時間</label><span class="time"></span></div><details><summary>填寫／修改內容</summary><label for="inspect-note-19" hidden>粥品餐廳巡檢內容</label><textarea id="inspect-note-19" rows="1" placeholder="可填寫異常狀況"></textarea></details></article><article class="item" data-name="201～207音樂室" data-done="false"><div class="head"><button class="toggle" type="button" aria-pressed="false"><span class="name">201～207音樂室</span><span class="value">未巡檢</span><span class="mark" aria-hidden="true">✓</span></button></div><div class="tools"><label><input type="checkbox">記錄時間</label><span class="time"></span></div><details><summary>填寫／修改內容</summary><label for="inspect-note-20" hidden>201～207音樂室巡檢內容</label><textarea id="inspect-note-20" rows="1" placeholder="可填寫異常狀況"></textarea></details></article></div></section><footer><button class="primary" id="inspect-copy">複製巡檢內容</button><span id="inspect-feedback" role="status"></span><div id="inspect-output-panel" hidden><label for="inspect-output" style="display:block;margin-top:12px">本次複製內容</label><textarea class="output" id="inspect-output" readonly></textarea></div></footer></main></section>
<script>
  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  const dateStr = `${mm}/${dd}`;


  function toHalfWidthDigits(value) {
    return String(value || "").replace(/[０-９]/g, character =>
      String.fromCharCode(character.charCodeAt(0) - 65248)
    );
  }

  function getSelectedRecordZones() {
    return Array.from(document.querySelectorAll("#recordZones .zone-toggle.active"))
      .map(button => button.dataset.zone);
  }

  function updateRecordZoneCards() {
    const selectedZones = getSelectedRecordZones();
    document.querySelectorAll("[data-zone-card]").forEach(card => {
      card.hidden = !selectedZones.includes(card.dataset.zoneCard);
    });
  }

  function toggleRecordZone(button) {
    const isActive = button.classList.contains("active");
    const selectedZones = getSelectedRecordZones();
    if (isActive && selectedZones.length === 1) return;

    button.classList.toggle("active");
    button.setAttribute("aria-pressed", String(button.classList.contains("active")));
    updateRecordZoneCards();
  }

  updateRecordZoneCards();

  function setActiveButton(groupId, value) {
    const group = document.getElementById(groupId);
    group.querySelectorAll(".btn").forEach(button => {
      const isActive = button.dataset.value === value;
      button.classList.toggle("active", isActive);
      button.setAttribute("aria-pressed", String(isActive));
    });
  }

  function updateCurrentShiftSelection() {
    const shiftButton = document.querySelector("#shiftName .active");
    const typeButton = document.querySelector("#shiftType .active");
    const display = document.getElementById("currentShiftSelection");
    const hasSelection = Boolean(shiftButton && typeButton);

    display.textContent = hasSelection
      ? `${shiftButton.dataset.value} ${typeButton.dataset.value}`
      : "未選擇";
    display.classList.toggle("has-selection", hasSelection);
  }

  function getAutomaticShift(date = new Date()) {
    const minutes = date.getHours() * 60 + date.getMinutes();
    const isBetween = (startHour, endHour) =>
      minutes >= startHour * 60 && minutes <= endHour * 60;

    if (isBetween(7, 9)) return { shift: "A班", type: "上班" };
    if (isBetween(16, 18)) return { shift: "A班", type: "下班" };
    if (isBetween(10, 12)) return { shift: "B班", type: "上班" };
    if (isBetween(19, 22)) return { shift: "B班", type: "下班" };
    return null;
  }

  function applyAutomaticShift(date = new Date()) {
    const selection = getAutomaticShift(date);
    setActiveButton("shiftName", selection?.shift);
    setActiveButton("shiftType", selection?.type);
    updateCurrentShiftSelection();
  }

  applyAutomaticShift(now);

  document.addEventListener("input", e => {
    if(e.target.classList.contains("autosize")) {
      e.target.style.height="auto";
      e.target.style.height=e.target.scrollHeight+"px";
    }
  });
  /* 點選式按鈕切換 */
  document.querySelectorAll('.btn-group').forEach(group => {
    group.addEventListener('click', e => {
      if (e.target.classList.contains('btn')) {
        group.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        group.querySelectorAll('.btn').forEach(button => {
          button.setAttribute("aria-pressed", String(button.classList.contains("active")));
        });
        updateCurrentShiftSelection();
      }
    });
  });

  function showCopySuccess(button) {
    clearTimeout(button.copyResetTimer);
    button.classList.remove("is-copied");
    void button.offsetWidth;
    button.classList.add("is-copied");
    button.setAttribute("aria-label", "已複製");

    button.copyResetTimer = setTimeout(() => {
      button.classList.remove("is-copied");
      button.setAttribute("aria-label", button.dataset.defaultLabel);
    }, 2500);
  }

  document.querySelectorAll(".copy-action").forEach(button => {
    button.dataset.defaultLabel = button.getAttribute("aria-label");
  });

  async function copyToClipboard(box, button, successMessage) {
    let copied = false;

    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(box.value);
        copied = true;
      } catch (error) {
        copied = false;
      }
    }

    if (!copied) {
      box.focus();
      box.select();
      copied = document.execCommand("copy");
    }

    if (copied) {
      alert(successMessage);
      showCopySuccess(button);
    } else {
      alert("複製失敗，請長按下方文字後手動複製。");
    }
  }

  /* 複製交接內容 */
  async function copyShift(button) {
    const shiftButton = document.querySelector('#shiftName .active');
    const typeButton = document.querySelector('#shiftType .active');
    if (!shiftButton || !typeButton) {
      alert("目前非上下班時段，請先選擇班別與類型。");
      return;
    }

    const shift = shiftButton.dataset.value;
    const type = typeButton.dataset.value;
    const outputShift = shift.replace("A", "Ａ").replace("B", "Ｂ");
    const person = document.getElementById("handoverPerson").value.trim();
    const item = document.getElementById("handoverItem").value.trim();
    const note = document.getElementById("handoverNote").value.trim();
    const extra = document.getElementById("handoverExtra").value.trim();

    let result = `${outputShift}${type}`;
    if (person) result += `：${person}`;
    else result += `：`;

    result += `\n交接物品：${item}`;
    result += `\n交接事項：${note}`;
    if (extra) result += `\n\n${extra}`;

    const box = document.getElementById("resultShift");
    box.value = result;
    await copyToClipboard(box, button, "交接內容已複製！");
  }

  /* 複製 LINE 水電紀錄 */
  async function copyBrief(button) {
    const selectedZones = getSelectedRecordZones();
    const zoneRecords = [];

    for (const zone of selectedZones) {
      const waterField = document.getElementById(`waterStatus${zone}`);
      const powerField = document.getElementById(`powerStatus${zone}`);
      const chlorineField = document.getElementById(`chlorineDose${zone}`);
      const noteField = document.getElementById(`recordNote${zone}`);
      const water = toHalfWidthDigits(waterField.value.trim());
      const power = toHalfWidthDigits(powerField.value.trim());

      if (!water) {
        alert(`請輸入 ${zone}區水表讀數。`);
        waterField.focus();
        return;
      }
      if (!/^\d{1,6}$/.test(water) || !waterField.checkValidity()) {
        alert(`${zone}區水表必須是 0 到 999999 的整數。`);
        waterField.focus();
        return;
      }
      if (!power) {
        alert(`請輸入 ${zone}區電表讀數。`);
        powerField.focus();
        return;
      }
      if (!/^\d{1,5}$/.test(power) || !powerField.checkValidity()) {
        alert(`${zone}區電表必須是 0 到 99999 的整數。`);
        powerField.focus();
        return;
      }
      if (chlorineField.value && !chlorineField.checkValidity()) {
        alert(`${zone}區氯錠投藥量必須是大於或等於 0 的數字。`);
        chlorineField.focus();
        return;
      }

      zoneRecords.push({
        zone,
        water,
        power,
        chlorineDose: toHalfWidthDigits(chlorineField.value.trim()),
        note: noteField.value.trim()
      });
    }

    const result = [];
    const zoneBlocks = zoneRecords.map(record => {
      const lines = [
        record.zone,
        `水：${record.water}`,
        `電：${record.power}`
      ];
      if (record.chlorineDose) lines.push(`氯錠：${record.chlorineDose}`);
      if (record.note) lines.push(record.note);
      return lines.join("\n");
    });
    result.push(zoneBlocks.join("\n\n"));

    const box = document.getElementById("resultBrief");
    box.value = result.join("\n");
    await copyToClipboard(box, button, "水電紀錄已複製！");
  }

</script>
<script>(function(){
const app=window.document.getElementById('inspection-app');
const document={
 getElementById:id=>app.querySelector('[id="'+id+'"]'),
 querySelectorAll:selector=>app.querySelectorAll(selector),
 createElement:tag=>window.document.createElement(tag),
 execCommand:command=>window.document.execCommand(command)
};
const items=[...document.querySelectorAll('.item')];
const dotContainer=document.getElementById('inspect-status-dots');
const dotTimers=new Map();
items.forEach((item,index)=>{
  const dot=document.createElement('span');
  dot.className='status-dot';
  dot.setAttribute('role','img');
  dot.setAttribute('aria-label',(index+1)+' '+item.dataset.name+'：未巡檢');
  dot.title=(index+1)+' '+item.dataset.name+'：未巡檢';
  dot.style.setProperty('--expanded-width',Math.min(190,Math.max(100,item.dataset.name.length*15+28))+'px');
  const name=document.createElement('span');name.className='status-name';name.textContent=item.dataset.name;name.setAttribute('aria-hidden','true');
  const check=document.createElement('span');check.className='status-check';check.textContent='✓';check.setAttribute('aria-hidden','true');
  dot.append(name,check);dotContainer.appendChild(dot);item.statusDot=dot;
});

let indicatorFrame=0;
function keepIndicatorVisible(dot){
  cancelAnimationFrame(indicatorFrame);
  const start=performance.now();
  function follow(){
    const viewport=dotContainer.getBoundingClientRect();
    const bounds=dot.getBoundingClientRect();
    if(bounds.right>viewport.right){dotContainer.scrollLeft+=bounds.right-viewport.right;}
    else if(bounds.left<viewport.left){dotContainer.scrollLeft-=viewport.left-bounds.left;}
    if(performance.now()-start<800){indicatorFrame=requestAnimationFrame(follow);}
  }
  follow();
}


function fitStatusDots(){
  const width=dotContainer.clientWidth;
  if(!width)return;
  const gap=width<400?4:6;
  const size=Math.min(22,Math.max(1,(width-gap*(items.length-1))/items.length));
  dotContainer.style.setProperty('--dot-size',size+'px');
  dotContainer.style.setProperty('--dot-gap',gap+'px');
}
fitStatusDots();
const statusResizeObserver=new ResizeObserver(fitStatusDots);
statusResizeObserver.observe(dotContainer);

function updateIndicator(item,wasDone){
  const done=item.dataset.done==='true';const dot=item.statusDot;
  dot.classList.toggle('done',done);
  const state=done?'已巡檢':'未巡檢';
  const label=(items.indexOf(item)+1)+' '+item.dataset.name+'：'+state;
  dot.title=label;dot.setAttribute('aria-label',label);
  if(done===wasDone)return;
  clearTimeout(dotTimers.get(item));
  dot.classList.remove('expanded');
  document.getElementById('inspect-status-announcement').textContent=item.dataset.name+'：'+state;
  if(done){
    items.forEach(other=>{if(other!==item){other.statusDot.classList.remove('expanded');clearTimeout(dotTimers.get(other));dotTimers.delete(other);}});
    void dot.offsetWidth;dot.classList.add('expanded');keepIndicatorVisible(dot);
    dotTimers.set(item,setTimeout(()=>{dot.classList.remove('expanded');keepIndicatorVisible(dot);dotTimers.delete(item);},1300));
  }else{dotTimers.delete(item);keepIndicatorVisible(dot);}
}

const date=new Date();const dateText=String(date.getMonth()+1).padStart(2,'0')+'/'+String(date.getDate()).padStart(2,'0');document.getElementById('inspect-date').textContent=dateText;
function update(item){document.getElementById('inspect-output-panel').hidden=true;const wasDone=item.dataset.done==='true';const text=item.querySelector('textarea').value.trim();const done=!!text;item.dataset.done=String(done);const state=!done?'blank':text==='正常'?'normal':'abnormal';item.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));const toggle=item.querySelector('.toggle');if(toggle)toggle.setAttribute('aria-pressed',String(done));item.querySelector('.value').textContent=!done?'未巡檢':text==='正常'?'正常':'異常已記錄';if(!done){item.querySelector('input').checked=false;item.querySelector('.time').textContent='';}updateIndicator(item,wasDone);render();}
function setState(item,state){const area=item.querySelector('textarea');if(state==='abnormal'){item.querySelector('details').open=true;if(area.value==='正常')area.value='';area.focus();}else{area.value=state==='normal'?'正常':'';}update(item);}
items.forEach(item=>{item.querySelector('.toggle')?.addEventListener('click',()=>setState(item,item.dataset.done==='true'?'blank':'normal'));item.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>setState(item,b.dataset.state)));item.querySelector('textarea').addEventListener('input',()=>update(item));item.querySelector('input').addEventListener('change',e=>{document.getElementById('inspect-output-panel').hidden=true;const now=new Date();item.querySelector('.time').textContent=e.target.checked?'（'+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+'）':'';render();});});
function render(){const lines=['園區水電管制巡檢('+dateText+')'];document.querySelectorAll('.group').forEach(group=>{if(group.dataset.group)lines.push('','【'+group.dataset.group+'】');group.querySelectorAll('.item').forEach(item=>{const text=item.querySelector('textarea').value.trim().split('\n').map(x=>x.trim()).filter(Boolean).join('，');lines.push(item.dataset.name+'：'+text+(text?item.querySelector('.time').textContent:''));});});return lines.join('\n');}
document.getElementById('inspect-copy').addEventListener('click',async()=>{const box=document.getElementById('inspect-output');box.value=render();document.getElementById('inspect-output-panel').hidden=false;let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(box.value);ok=true;}}catch{}if(!ok){box.focus();box.select();try{ok=document.execCommand('copy');}catch{}}document.getElementById('inspect-feedback').textContent=ok?'已複製 ✓':'請選取下方文字手動複製';if(ok){window.alert('已複製');}});
let visibilityObserver;
function observeInspectionVisibility(){
  if(visibilityObserver)visibilityObserver.disconnect();
  // Observe only the upper half of the viewport; pixel margins use viewport height.
  visibilityObserver=new IntersectionObserver(entries=>{
    const visible=entries[0].isIntersecting;
    app.classList.toggle('is-in-view',visible);
    if(visible)fitStatusDots();
  },{rootMargin:`0px 0px -${window.innerHeight / 2}px 0px`,threshold:0});
  visibilityObserver.observe(app);
}
observeInspectionVisibility();
window.addEventListener('resize',observeInspectionVisibility);
})();</script>
